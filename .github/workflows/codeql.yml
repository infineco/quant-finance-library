name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # Manual build: autobuild would pick the first solution/project it finds; an explicit solution build
          # of the whole multi-project repository is deterministic.
          build-mode: manual

      - name: Build
        run: |
          dotnet restore QuantFinance.sln
          dotnet build QuantFinance.sln -c Release --no-restore

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
