name: Release

# Pushing a tag vMAJOR.MINOR.PATCH[-prerelease] builds, tests and packs the library, publishes the packages to
# nuget.org through NuGet trusted publishing (when the NUGET_USER variable is set) and creates the GitHub Release. The package version is the tag
# without the leading "v" (MinVer); see docs/packaging.md.
on:
  push:
    tags:
      - 'v*'
  # Re-publish an existing tag to nuget.org (for instance after setting up trusted publishing). It builds the tag with
  # the workflow of the branch it is started from and skips the GitHub Release, which already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, e.g. v1.15.1
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and pack
    # x64 Linux: the Hybridizer runtime package is AMD64-stamped, so the Hybridizer-dependent CPU tests run here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # MinVer reads the tag and counts commits since it: it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag is a version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="${TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not of the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore QuantFinance.sln

      - name: Build
        run: dotnet build QuantFinance.sln -c Release --no-restore

      - name: Test
        run: dotnet test QuantFinance.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Pack
        run: dotnet pack QuantFinance.sln -c Release --no-build -o artifacts/packages

      - name: Check the package versions match the tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          count=0
          for f in artifacts/packages/*.nupkg; do
            count=$((count + 1))
            case "$f" in
              *".${VERSION}.nupkg") ;;
              *) echo "::error::$f does not carry version $VERSION"; exit 1 ;;
            esac
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No package was produced."
            exit 1
          fi
          echo "$count packages at version $VERSION"
          ls -l artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  publish-nuget:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # NuGet trusted publishing: the job's GitHub OIDC token is exchanged for a one-hour nuget.org API key. Nothing
      # long-lived is stored; the nuget.org policy trusts infineco/quant-finance-library, workflow release.yml.
      id-token: write
    env:
      # nuget.org profile name (not the e-mail) that owns the trusted-publishing policy: repository variable NUGET_USER.
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Skip notice
        if: env.NUGET_USER == ''
        run: |
          echo "::notice::The NUGET_USER repository variable is not set, so nothing was pushed to nuget.org. The packages are attached to this run and to the GitHub Release."

      - uses: actions/setup-dotnet@v6
        if: env.NUGET_USER != ''
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        if: env.NUGET_USER != ''
        with:
          name: packages
          path: packages

      # Requested right before the push: the temporary key is valid for one hour.
      - name: NuGet login (OIDC to temporary API key)
        if: env.NUGET_USER != ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      # Each .nupkg is pushed with its .snupkg symbols next to it. --skip-duplicate makes a re-run of the workflow safe.
      - name: Push packages
        if: env.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  github-release:
    name: Create the GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      # Release notes: the CHANGELOG.md section of this version ("## [1.2.3]" or "## [1.2.3-rc.1]"), else the
      # [Unreleased] section, else a pointer to the changelog.
      - name: Extract the changelog section
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          extract() {
            awk -v head="## [$1]" '
              index($0, head) == 1 { on = 1; next }
              on && /^## \[/       { exit }
              on && /^\[[^]]+\]: / { exit }
              on                   { print }
            ' CHANGELOG.md
          }
          extract "$VERSION" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            extract "Unreleased" > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > release-notes.md
          fi
          {
            echo
            echo "NuGet packages: \`InFine.QuantFinance.*\` $VERSION (see [docs/packaging.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/packaging.md))."
          } >> release-notes.md
          cat release-notes.md

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          case "$VERSION" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}" \
            packages/*.nupkg packages/*.snupkg
