apiRules:
  - exclude:
      uidRegex: ^Hybridizer
      type: Namespace
  - exclude:
      uidRegex: \.<>
  - exclude:
      uidRegex: ^System\.Runtime\.CompilerServices
  - exclude:
      hasAttribute:
        uid: System.Runtime.CompilerServices.CompilerGeneratedAttribute
  - exclude:
      hasAttribute:
        uid: System.ComponentModel.EditorBrowsableAttribute
        ctorArguments:
          - System.ComponentModel.EditorBrowsableState.Never
attributeRules:
  - exclude:
      uidRegex: ^Hybridizer\.
  - exclude:
      uidRegex: ^System\.Runtime\.CompilerServices\.
  - exclude:
      uidRegex: ^System\.Diagnostics\.CodeAnalysis\.
  - exclude:
      uidRegex: ^System\.Reflection\.DefaultMemberAttribute
